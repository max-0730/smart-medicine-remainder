<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Medicine Reminder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💊 Smart Medicine Reminder</h1>

    <div class="form">
        <input type="text" id="name" placeholder="Medicine Name">
        <input type="time" id="time">
        <input type="text" id="dose" placeholder="Dosage (e.g. 1 tablet)">
        <button onclick="addMedicine()">Add Medicine</button>
    </div>

    <ul id="list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
